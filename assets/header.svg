<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Kumar Saurabh Mishra — Backend Engineer and Product Builder</title>
  <desc id="desc">A dark indigo and cyan developer profile banner with a stylized system architecture motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#10142b"/>
      <stop offset="1" stop-color="#111b36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#93c5fd" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1030" cy="80" r="210" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="160" cy="350" r="190" fill="#818cf8" opacity=".08" filter="url(#soft)"/>

  <g opacity=".68" fill="none" stroke-linecap="round">
    <path d="M824 91H940V62H1048" stroke="url(#accent)" stroke-width="2"/>
    <path d="M824 179H902V224H1038" stroke="url(#accent)" stroke-width="2"/>
    <path d="M824 267H956V294H1082" stroke="url(#accent)" stroke-width="2"/>
    <path d="M940 62V132H1090" stroke="#818cf8" stroke-width="2" stroke-opacity=".6"/>
    <circle cx="824" cy="91" r="7" fill="#818cf8" stroke="none"/>
    <circle cx="824" cy="179" r="7" fill="#22d3ee" stroke="none"/>
    <circle cx="824" cy="267" r="7" fill="#818cf8" stroke="none"/>
    <circle cx="1048" cy="62" r="7" fill="#22d3ee" stroke="none"/>
    <circle cx="1090" cy="132" r="7" fill="#818cf8" stroke="none"/>
    <circle cx="1038" cy="224" r="7" fill="#22d3ee" stroke="none"/>
    <circle cx="1082" cy="294" r="7" fill="#818cf8" stroke="none"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="70" y="82" fill="#67e8f9" font-size="17" font-weight="600" letter-spacing="4">HELLO, WORLD — I'M</text>
    <text x="67" y="158" fill="#f8fafc" font-size="54" font-weight="750" letter-spacing="-1.5">Kumar Saurabh Mishra</text>
    <rect x="70" y="184" width="575" height="4" rx="2" fill="url(#accent)"/>
    <text x="70" y="235" fill="#cbd5e1" font-size="25" font-weight="500">Backend Engineer  •  System Thinker  •  Product Builder</text>
    <text x="70" y="284" fill="#94a3b8" font-size="18">Java · Spring Boot · Microservices · Cloud · Search · Practical AI</text>
  </g>

  <g transform="translate(739 53)">
    <rect width="74" height="74" rx="18" fill="#111827" stroke="#818cf8" stroke-opacity=".62"/>
    <path d="M24 26l-10 11 10 11M50 26l10 11-10 11M42 19L32 55" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="url(#accent)" stroke-opacity=".3" stroke-width="2"/>
</svg>